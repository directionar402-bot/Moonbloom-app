<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8DCEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moonbloom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Moonbloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a pearly diary — sidebar of tabs on desktop, bottom ribbon on phones; glass pages float over a soft dusk sky */
:root{
  --bg:#FFF9FD; --bg2:#FBEAF4;
  --paper:rgba(255,255,255,.66); --paper-solid:#FFFFFF;
  --pink:#F8DCEB; --candy:#F4BBDD; --lav:#DCCBFA; --lilac:#BBA3E8; --sky:#DDEBFF;
  --ink:#5D426D; --ink-soft:#8A6D99; --ink-faint:#B9A4C4;
  --line:rgba(93,66,109,.13); --line-strong:rgba(93,66,109,.24);
  --glow:rgba(244,187,221,.55); --shadow:0 10px 30px -14px rgba(93,66,109,.35);
  --accent:#E07BB5; --accent2:#BBA3E8; --btn:#F4BBDD; --btn-ink:#5D426D;
  --water:#9CC3F2; --water2:#C9DDF8;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:22px; --r-sm:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211830; --bg2:#2C1F3B; --paper:rgba(56,40,72,.62); --paper-solid:#33253F;
  --pink:#4A3053; --candy:#8C557E; --lav:#3F345A; --lilac:#BBA3E8; --sky:#2D3A57;
  --ink:#F7E9F3; --ink-soft:#CDB6D9; --ink-faint:#8D7A9C;
  --line:rgba(247,233,243,.12); --line-strong:rgba(247,233,243,.24);
  --glow:rgba(187,163,232,.30); --shadow:0 12px 30px -14px rgba(0,0,0,.6);
  --btn:#8C557E; --btn-ink:#FFF4FA; --water:#7FA6DE; --water2:#3B4B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211830; --bg2:#2C1F3B; --paper:rgba(56,40,72,.62); --paper-solid:#33253F;
  --pink:#4A3053; --candy:#8C557E; --lav:#3F345A; --lilac:#BBA3E8; --sky:#2D3A57;
  --ink:#F7E9F3; --ink-soft:#CDB6D9; --ink-faint:#8D7A9C;
  --line:rgba(247,233,243,.12); --line-strong:rgba(247,233,243,.24);
  --glow:rgba(187,163,232,.30); --shadow:0 12px 30px -14px rgba(0,0,0,.6);
  --btn:#8C557E; --btn-ink:#FFF4FA; --water:#7FA6DE; --water2:#3B4B6B; color-scheme:dark}
:root[data-accent="lilac"]{--accent:#A88BE0;--accent2:#F4BBDD}
:root[data-accent="sky"]{--accent:#7FA8E8;--accent2:#DCCBFA}
:root[data-accent="peach"]{--accent:#EE9C8F;--accent2:#BBA3E8}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(60vmax 40vmax at 10% -5%,var(--pink),transparent 60%),
             radial-gradient(50vmax 40vmax at 100% 10%,var(--lav),transparent 60%),
             radial-gradient(60vmax 50vmax at 60% 110%,var(--sky),transparent 60%),var(--bg)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--lilac);opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.12;transform:scale(.6)}}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,1.4rem + 2.6vw,3rem);font-style:italic}
h2{font-size:1.75rem;font-style:italic}
h3{font-size:1.3rem}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
a{color:var(--ink)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;max-width:1320px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:28px 14px 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px}
.brand b{font-family:var(--f-display);font-style:italic;font-size:1.7rem;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--ink-soft);text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px -10px var(--glow)}
.side .wallet{margin-top:auto;padding:12px 14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);display:grid;gap:6px}
main{min-width:0;padding-block:26px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:18px;max-width:1040px}
.bottom{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;gap:4px;
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    background:var(--paper);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;border-radius:16px;font-size:.7rem;font-weight:800;color:var(--ink-soft);cursor:pointer}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--ink);background:var(--pink)}
}

/* surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0;position:relative}
.card.pearl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.sep{height:1px;background:var(--line);margin:4px 0}
.orn{color:var(--accent);font-family:var(--f-display)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;font-weight:800;font-size:.88rem;cursor:pointer;background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 16px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink)}
.btn.soft{background:var(--lav);color:var(--ink);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:.8rem}
.btn.icon{padding:7px;width:34px;height:34px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{border:0;background:none;padding:0;color:var(--ink-soft);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;border:1px solid var(--line-strong);background:transparent;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--candy);border-color:transparent;color:var(--btn-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:800;background:var(--pink);color:var(--ink)}
.pill.lav{background:var(--lav)} .pill.sky{background:var(--sky)}

input[type=text],input[type=number],input[type=time],input[type=date],input:not([type]),select,textarea{
  width:100%;border:1px solid var(--line-strong);background:var(--paper-solid);border-radius:12px;padding:9px 12px;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.6}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--ink-soft);min-width:0}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

/* checklist */
.check{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.check:hover{background:var(--pink)}
.check .box{width:22px;height:22px;flex:none;border-radius:8px;border:1.5px solid var(--line-strong);display:grid;place-items:center;transition:.2s}
.check[aria-checked="true"] .box{background:var(--accent);border-color:transparent}
.check[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check[aria-checked="true"] .t{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--accent)}
.check .t{flex:1;min-width:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:22px 24px}
.hero .mascot{width:150px;height:150px}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr) 96px;padding:18px}.hero .mascot{width:96px;height:96px}}
.intent{font-family:var(--f-display);font-style:italic;font-size:1.3rem;line-height:1.35;margin-top:10px}
.mascot{cursor:pointer}
.mascot.bounce{animation:bounce .9s ease}
@keyframes bounce{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}80%{transform:translateY(-4px)}}
.floaty{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.rings{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.ring{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700}
.ring svg{width:46px;height:46px}

/* quests */
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line-strong);background:transparent;width:100%;text-align:left;cursor:pointer}
.quest.done{border-style:solid;border-color:transparent;background:var(--pink)}
.quest .ic{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--lav);color:var(--ink)}
.quest.done .ic{background:var(--accent);color:#fff}
.quest .rw{margin-left:auto;font-size:.75rem;font-weight:800;color:var(--ink-soft);white-space:nowrap}

/* water */
.bottle{width:120px;height:190px;flex:none}
.wave{animation:wave 3.2s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.slot.done{background:var(--sky)}
.slot.skip{opacity:.55}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-body)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chartwrap{overflow-x:auto}

/* toasts & modal */
#toasts{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;width:min(360px,calc(100vw - 32px))}
@media (max-width:860px){#toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--paper-solid);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:10px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px);opacity:.3}}
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(60,40,75,.35);backdrop-filter:blur(6px)}
#modal .sheet{background:var(--paper-solid);border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px;display:grid;gap:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

.empty{text-align:center;padding:26px 14px;display:grid;gap:8px;justify-items:center;color:var(--ink-soft)}
.orb{width:180px;height:180px;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#fff,var(--candy) 45%,var(--lilac));box-shadow:0 0 60px var(--glow);transition:transform 4s ease-in-out}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--lav)}
.photo img{width:100%;height:100%;object-fit:cover;filter:blur(18px);transform:scale(1.1);transition:.3s}
.photo.show img{filter:none;transform:none}
.photo .cap{position:absolute;inset:auto 0 0 0;padding:6px 8px;font-size:.72rem;font-weight:800;background:linear-gradient(transparent,rgba(40,25,50,.6));color:#fff;display:flex;justify-content:space-between;align-items:center}
.moodgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.moodgrid div{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.72rem;font-weight:700;border:1px solid var(--line)}
.pebble{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.lvl{height:10px;border-radius:999px;background:var(--lav);overflow:hidden}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--candy),var(--accent));border-radius:inherit}
.shop{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.shop .card{padding:12px;text-align:center;display:grid;gap:6px;justify-items:center}
.ach{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ach div{padding:12px;border-radius:16px;border:1px dashed var(--line-strong);display:grid;gap:4px;text-align:center}
.ach div.got{border-style:solid;background:var(--pink);border-color:transparent}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
.sync.ok i{background:#7CC7A0}
.wl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line)}

/* 2.0 */
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:760px){.split.even{grid-template-columns:minmax(0,1fr)}}
.next{padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--lav));}
.timeline{display:grid;gap:2px;max-height:360px;overflow:auto;padding-right:4px}
.tl{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border-left:3px solid transparent}
.tl.now{background:var(--pink);border-left-color:var(--accent)}
.tl.off{opacity:.55}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.weekgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.wday{border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.sess{display:grid;gap:2px;text-align:left;border:0;border-radius:12px;padding:8px 9px;cursor:pointer;color:var(--ink);width:100%}
.sess.t-res{background:var(--candy)}.sess.t-cardio{background:var(--sky)}.sess.t-flex,.sess.t-mob{background:var(--lav)}.sess.t-rest{background:transparent;border:1px dashed var(--line-strong)}
.diff{display:inline-flex;gap:3px}.diff i{width:8px;height:8px;border-radius:50%;background:var(--lav);display:block}.diff i.on{background:var(--accent)}
.sug{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--lav);display:grid;gap:2px}
.sug.up{background:var(--pink)}.sug.down,.sug.care{background:var(--sky)}
.ex details{margin-top:10px}
.sets{display:grid;grid-template-columns:34px repeat(2,minmax(0,1fr)) 76px;gap:6px 8px;align-items:center;margin-top:12px}
.mealgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.bcell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bcell.today{outline:2px solid var(--accent)}
.bdots{display:flex;flex-wrap:wrap;gap:2px}.bdots i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.bdots i.wk{background:var(--lilac)}.bdots i.done{background:var(--water)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="stars" aria-hidden="true"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><span id="brandMoon"></span><b>Moonbloom</b></div>
    <nav class="nav" id="sideNav" aria-label="Sections"></nav>
    <div class="wallet" id="sideWallet"></div>
  </aside>
  <main id="main"></main>
</div>
<nav class="bottom" id="bottomNav" aria-label="Sections"></nav>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const dk=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseDk=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtDate=(k,o={month:"short",day:"numeric"})=>parseDk(k).toLocaleDateString("en-US",o);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=t=>{const[h,m]=(t||"0:0").split(":").map(Number);return h*60+m};
const toTime=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const ampm=t=>{const m=toMin(t);const h=Math.floor(m/60),mm=m%60;return ((h%12)||12)+":"+pad(mm)+" "+(h<12?"AM":"PM")};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let REF=null,REFJ=null,syncState="local",saveT=null;
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(push,900)}
function split(){const{journal,scripts,...core}=S;return{core:JSON.stringify(core),j:JSON.stringify({journal,scripts})}}
async function push(){if(!REF)return;try{const p=split();await REF.set({json:p.core,at:S.updatedAt});await REFJ.set({json:p.j,at:S.updatedAt});setSync("ok")}catch(e){setSync("local")}}
function setSync(s){syncState=s;const el=$("#syncLbl");if(el)el.outerHTML=syncBadge()}
function syncBadge(){return `<span id="syncLbl" class="sync tiny ${syncState==="ok"?"ok":""}"><i></i>${syncState==="ok"?"Synced to your account":"Saved in this browser"}</span>`}
async function connect(){
  const c=window.claude;if(!c||!c.use)return;
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    const col=db.collection("data/users/"+id);REF=col.doc("core");REFJ=col.doc("journal");
    const [a,b]=await Promise.all([REF.get(),REFJ.get()]);
    if(a.exists){const r=a.data();if((r.at||0)>(S.updatedAt||0)){const core=JSON.parse(r.json);let j={};if(b.exists){try{j=JSON.parse(b.data().json)}catch(e){}}S=merge(DEF(),Object.assign(core,j));migrate();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}applyAccent();render()}else if((S.updatedAt||0)>(r.at||0))await push()}
    else if(S.updatedAt)await push();
    setSync("ok");
  }catch(e){setSync("local")}
}

 <linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--water)"/><stop offset="1" stop-color="var(--lilac)"/></linearGradient></defs>
 <g clip-path="url(#bc)"><rect x="0" y="0" width="120" height="190" fill="var(--paper-solid)"/>
 <g transform="translate(0 ${lvlY.toFixed(1)})"><g class="wave"><path d="M0 4 Q15 -4 30 4 T60 4 T90 4 T120 4 T150 4 T180 4 V200 H0z" fill="url(#wg)" opacity=".9"/></g></g>
 <circle cx="50" cy="${(lvlY+40).toFixed(0)}" r="3" fill="#fff" opacity=".6"/><circle cx="66" cy="${(lvlY+70).toFixed(0)}" r="2" fill="#fff" opacity=".6"/></g>
 <path d="M38 26h44v6c0 6 14 12 14 26v110a14 14 0 0 1-14 14H38a14 14 0 0 1-14-14V58c0-14 14-20 14-26z" fill="none" stroke="var(--line-strong)" stroke-width="2"/>
 <rect x="40" y="10" width="40" height="16" rx="6" fill="var(--candy)"/><path d="M60 26 C46 18 44 36 60 26 C76 18 78 36 60 26z" fill="var(--accent)" opacity=".85"/>
 <path d="M34 66 v80" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/></svg>`}
function barChart(vals,labels,goal,unit){const W=560,H=190,pl=36,pb=24,pt=14;const max=Math.max(goal||0,...vals,1)*1.12;const bw=(W-pl)/vals.length;const y=v=>pt+(H-pt-pb)*(1-v/max);
 const ticks=[0,max/3,2*max/3].map(t=>Math.round(t/(unit==="ml"?250:5))*(unit==="ml"?250:5));
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
 for(const t of [...new Set(ticks)]){s+=`<line class="gridl" x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t>=1000?(t/1000).toFixed(1)+"k":t}</text>`}
 vals.forEach((v,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6;const hh=Math.max(0,(H-pb)-y(v));s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${hh}" rx="8" fill="${i===vals.length-1?"var(--accent)":"var(--candy)"}"/><text x="${x+w/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
 if(goal)s+=`<line x1="${pl}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--lilac)" stroke-width="2" stroke-dasharray="5 5"/><text x="${W}" y="${y(goal)-6}" text-anchor="end">goal</text>`;
 return s+"</svg>"}
function lineChart(pts,unit){if(pts.length<2)return `<div class="empty small">Add one more entry to see a trend line.</div>`;const W=600,H=220,pl=44,pr=16,pt=16,pb=28;const xs=pts.map(p=>parseDk(p.d).getTime()),ys=pts.map(p=>p.v);
 let mn=Math.min(...ys),mx=Math.max(...ys);const padv=Math.max((mx-mn)*.25,.5);mn-=padv;mx+=padv;const x0=Math.min(...xs),x1=Math.max(...xs);
 const X=t=>pl+(W-pl-pr)*((t-x0)/((x1-x0)||1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
 for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3;s+=`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`}
 const d=pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
 s+=`<path d="${d} L${X(xs[xs.length-1])} ${H-pb} L${X(xs[0])} ${H-pb}Z" fill="var(--candy)" opacity=".35"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
 pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="${last?5.5:3.5}" fill="${last?"var(--accent)":"var(--paper-solid)"}" stroke="var(--accent)" stroke-width="2"/>`});
 s+=`<text x="${pl}" y="${H-6}">${fmtDate(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text><text x="${X(xs[xs.length-1])}" y="${Y(pts[pts.length-1].v)-12}" text-anchor="end" style="font-weight:800;fill:var(--ink)">${pts[pts.length-1].v.toFixed(1)} ${unit}</text>`;
 return s+"</svg>"}

 <div class="fields" style="margin-top:10px">${[["strength","Strength"],["stamina","Stamina"],["energy","Energy"],["comfort","Physical comfort"],["bloat","Digestive ease"]].map(([k,l])=>`<label class="f">${l} <span class="num" id="o_${k}">${e&&e.feel?e.feel[k]||3:3}</span>/5<input type="range" min="1" max="5" id="f_${k}" value="${e&&e.feel?e.feel[k]||3:3}" data-out="o_${k}"></label>`).join("")}</div>
 <label class="f" style="margin-top:10px">Private note<textarea id="mNote" placeholder="Cycle day, sleep, how clothes feel, anything you want to remember">${e?esc(e.note||""):""}</textarea></label>

function measureList(){if(!S.measures.length)return `<section class="card"><div class="empty">${moonSvg(.1,44)}<p><b>No entries yet.</b></p><p class="small">Your first measurements become the gentle starting point for every trend.</p></div></section>`;
 const L=S.measures.slice().sort((a,b)=>b.date.localeCompare(a.date));
 return `<section class="card"><div class="card-h"><h3>History</h3><span class="tiny muted">${L.length} entries</span></div><div class="stack">${L.map(m=>`<div class="wl"><span class="pill num">${fmtDate(m.date,{month:"short",day:"numeric",year:"2-digit"})}</span><span class="small num" style="min-width:0">${MFIELDS.filter(([k])=>m[k]!=null).map(([k,l])=>`${l} ${toDispL(m[k]).toFixed(1)}`).join(" · ")||"Feelings only"}${m.weight!=null?` · ${toDispW(m.weight).toFixed(1)} ${uW()}`:""}${m.note?`<br><span class="tiny muted">${esc(m.note)}</span>`:""}</span><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn ghost sm" data-a="editM" data-id="${m.id}">Edit</button><button class="btn icon ghost" data-a="delM" data-id="${m.id}" aria-label="Delete">${I.x}</button></span></div>`).join("")}</div></section>`}
function metricVal(m,k){if(k==="weight")return m.weight!=null?toDispW(m.weight):null;if(k.startsWith("c_"))return m.custom&&m.custom[k.slice(2)]!=null?toDispL(m.custom[k.slice(2)]):null;if(["strength","stamina","energy","comfort","bloat"].includes(k))return m.feel?m.feel[k]:null;if(k==="bf")return m.bf;return m[k]!=null?toDispL(m[k]):null}
function trends(){const opts=[...MFIELDS,...S.customFields.map(c=>["c_"+c.id,c.name]),["weight","Weight"],["bf","Body fat %"],["strength","Strength"],["stamina","Stamina"],["energy","Energy"],["comfort","Comfort"]];
 const L=S.measures.slice().sort((a,b)=>a.date.localeCompare(b.date));const pts=L.map(m=>({d:m.date,v:metricVal(m,BMET)})).filter(p=>p.v!=null);
 const unit=BMET==="weight"?uW():BMET==="bf"?"%":["strength","stamina","energy","comfort"].includes(BMET)?"/5":uLen();
 const dates=L.map(m=>m.date);if(!CMP.a&&dates.length)CMP.a=dates[0];if(!CMP.b&&dates.length)CMP.b=dates[dates.length-1];
 const A=L.find(m=>m.date===CMP.a),B=L.find(m=>m.date===CMP.b);
 const cmp=A&&B?opts.map(([k,l])=>{const a=metricVal(A,k),b=metricVal(B,k);if(a==null||b==null)return"";const d=b-a;return `<div class="wl" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="small">${esc(l)}</span><span class="small num muted">${a.toFixed(1)} → ${b.toFixed(1)}</span><span class="pill lav num">${d>0?"+":""}${d.toFixed(1)}</span></div>`}).join(""):"";
 return `<section class="card pearl"><div class="card-h"><h3>Trend</h3><select id="bMet" data-ch="bMet" style="width:auto">${opts.map(([k,l])=>`<option value="${k}" ${k===BMET?"selected":""}>${esc(l)}</option>`).join("")}</select></div><div class="chartwrap">${pts.length?lineChart(pts,unit):'<div class="empty small">No data for this measurement yet.</div>'}</div></section>
 <section class="card"><div class="card-h"><h3>Compare two moments</h3></div>${dates.length>1?`<div class="fields"><label class="f">From<select data-ch="cmpA">${dates.map(d=>`<option ${d===CMP.a?"selected":""} value="${d}">${fmtDate(d,{month:"short",day:"numeric",year:"numeric"})}</option>`).join("")}</select></label><label class="f">To<select data-ch="cmpB">${dates.map(d=>`<option ${d===CMP.b?"selected":""} value="${d}">${fmtDate(d,{month:"short",day:"numeric",year:"numeric"})}</option>`).join("")}</select></label></div><div class="stack" style="margin-top:12px">${cmp||'<p class="small muted">These two entries share no measurements.</p>'}</div><p class="tiny muted" style="margin-top:10px">Differences are shown neutrally. Small shifts are normal and often just water, food or cycle timing.</p>`:'<p class="small muted">Save at least two entries to compare them.</p>'}</section>`}

/* ---------- drafts ---------- */
function draftGet(k){try{return localStorage.getItem("mb.d."+k+"."+dk())||""}catch(e){return""}}
function draftSet(k,v){try{localStorage.setItem("mb.d."+k+"."+dk(),v)}catch(e){}}
function draftClear(k){try{localStorage.removeItem("mb.d."+k+"."+dk())}catch(e){}}

/* ---------- reminders ---------- */
function allRem(){const wd=new Date().getDay();return S.water.schedule.filter(s=>s.on).map(s=>({...s,water:true})).concat(S.reminders.filter(r=>r.on&&(!r.days||!r.days.length||r.days.includes(wd))))}
function upcoming(){const d=day(),n=nowMin();return allRem().map(r=>{const st=d.rem[r.id]||"";if(st==="done"||st==="skip")return null;const at=st.startsWith("snooze@")?st.split("@")[1]:r.time;return toMin(at)>=n?{...r,at}:null}).filter(Boolean).sort((a,b)=>toMin(a.at)-toMin(b.at))}
const shown=new Set();
function tickReminders(){const d=day(),n=nowMin();for(const r of allRem()){const st=d.rem[r.id]||"";if(st==="done"||st==="skip")continue;const at=st.startsWith("snooze@")?st.split("@")[1]:r.time;const m=toMin(at);const key=r.id+at+dk();if(n>=m&&n-m<=120&&!shown.has(key)){shown.add(key);remToast(r);chime()}}}

/* ---------- phone notifications (installed app) ---------- */

 el.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;const d=day(),a=b.dataset.r;if(a==="log"){logWater(r.ml);d.rem[r.id]="done"}else if(a==="done"){d.rem[r.id]="done";if(/skin/i.test(r.label))go("care")}else if(a==="snooze"){d.rem[r.id]="snooze@"+toTime(nowMin()+15)}else d.rem[r.id]="skip";save();el.remove();render()});

/* ---------- audio ---------- */
const AUD={ctx:null,kind:null,nodes:[],master:null,timer:null,left:0,min:10,vol:60,wvol:30,aff:true,affT:null,started:0};
function ac(){if(!AUD.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AUD.ctx=new C()}if(AUD.ctx.state==="suspended")AUD.ctx.resume();return AUD.ctx}
function chime(){const c=AUD.ctx;if(!c||c.state!=="running")return;const t=c.currentTime;[880,1318.5].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(0,t+i*.18);g.gain.linearRampToValueAtTime(.08,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.18+1.4);o.connect(g).connect(c.destination);o.start(t+i*.18);o.stop(t+i*.18+1.5)})}
function noiseBuf(c){const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}return b}
function startSound(kind){stopSound(true);const c=ac();if(!c){toast("<b>Sound isn't supported in this browser.</b>");return}AUD.kind=kind;AUD.started=Date.now();
 const m=c.createGain();m.gain.value=0;m.gain.linearRampToValueAtTime(AUD.vol/100*.5,c.currentTime+3);const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;m.connect(lp).connect(c.destination);AUD.master=m;const N=AUD.nodes;
 const lfo=(target,rate,depth,base)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=rate;g.gain.value=depth;o.connect(g).connect(target);target.value=base;o.start();N.push(o)};
 if(kind==="moon"){[174.61,220,261.63,329.63,392].forEach((f,i)=>{[0,-4,4].forEach(dt=>{const o=c.createOscillator(),g=c.createGain();o.type=i%2?"triangle":"sine";o.frequency.value=f;o.detune.value=dt;g.gain.value=0;lfo(g.gain,.05+i*.017,.035,.05);o.connect(g).connect(m);o.start();N.push(o)})})}
 if(kind==="rain"||kind==="ocean"){const s=c.createBufferSource();s.buffer=noiseBuf(c);s.loop=true;const f=c.createBiquadFilter();f.type=kind==="rain"?"bandpass":"lowpass";f.frequency.value=kind==="rain"?1400:520;f.Q.value=.6;const g=c.createGain();if(kind==="ocean")lfo(g.gain,.09,.45,.55);else g.gain.value=.7;s.connect(f).connect(g).connect(m);s.start();N.push(s);
  if(kind==="rain"){AUD.drip=setInterval(()=>{const t=c.currentTime,o=c.createOscillator(),gg=c.createGain();o.frequency.value=1800+Math.random()*2400;gg.gain.setValueAtTime(.05,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(gg).connect(m);o.start(t);o.stop(t+.1)},170)}}
 if(kind==="bowls"){const dl=c.createDelay(2);dl.delayTime.value=.45;const fb=c.createGain();fb.gain.value=.35;dl.connect(fb).connect(dl);dl.connect(m);const strike=()=>{const t=c.currentTime,base=[261.63,329.63,392,440,523.25][Math.floor(Math.random()*5)];[1,2.76,5.4].forEach((h,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=base*h;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22/(i+1),t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+7-i*1.8);o.connect(g);g.connect(m);g.connect(dl);o.start(t);o.stop(t+7.2)})};strike();AUD.drip=setInterval(strike,5200)}
 AUD.left=AUD.min*60;clearInterval(AUD.timer);AUD.timer=setInterval(()=>{AUD.left--;const el=$("#audT");if(el)el.textContent=fmtSec(AUD.left);if(AUD.left<=0)stopSound()},1000);
 if(AUD.aff)startWhisper();render()}
function stopSound(silent){const c=AUD.ctx;if(AUD.kind){const mins=Math.round((Date.now()-AUD.started)/60000);if(mins>0){day().listen+=mins;save();evalQuests()}}
 clearInterval(AUD.timer);clearInterval(AUD.drip);stopWhisper();if(c&&AUD.master){const m=AUD.master,N=AUD.nodes.splice(0);m.gain.cancelScheduledValues(c.currentTime);m.gain.setValueAtTime(m.gain.value,c.currentTime);m.gain.linearRampToValueAtTime(0,c.currentTime+1.2);setTimeout(()=>{N.forEach(n=>{try{n.stop()}catch(e){}});try{m.disconnect()}catch(e){}},1400)}
 AUD.kind=null;AUD.master=null;if(!silent)render()}
function startWhisper(){if(!window.speechSynthesis)return;stopWhisper();const pool=(S.affirm.list.filter(a=>a.fav).length?S.affirm.list.filter(a=>a.fav):S.affirm.list).map(a=>a.t);let i=0;const say=()=>{if(!AUD.kind)return;const u=new SpeechSynthesisUtterance(pool[i++%pool.length]);u.volume=AUD.wvol/100*.6;u.rate=.82;u.pitch=1.1;const v=speechSynthesis.getVoices().find(v=>v.name===S.profile.voice);if(v)u.voice=v;speechSynthesis.speak(u)};say();AUD.affT=setInterval(say,9000)}
function stopWhisper(){clearInterval(AUD.affT);try{speechSynthesis.cancel()}catch(e){}}
function speak(t){if(!window.speechSynthesis){toast("<b>Read-aloud isn't available in this browser.</b>");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.88;u.pitch=1.05;const v=speechSynthesis.getVoices().find(v=>v.name===S.profile.voice);if(v)u.voice=v;speechSynthesis.speak(u)}
const fmtSec=s=>Math.floor(Math.max(0,s)/60)+":"+pad(Math.max(0,s)%60);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&AUD.kind)stopSound(true)});

/* ---------- modal flows ---------- */
let MT=null;
function openModal(html){const m=$("#modal");m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false}
function closeModal(){clearInterval(MT);MT=null;const m=$("#modal");m.hidden=true;m.innerHTML="";try{speechSynthesis.cancel()}catch(e){}}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});
function runRoutine(i){const r=ROUTINES[i];let s=0,left=r.steps[0][1],paused=false,elapsed=0;
 const draw=()=>{const st=r.steps[s];const nx=r.steps[s+1];openModal(`<div class="row" style="justify-content:space-between"><span class="eyebrow">${r.n} · ${s+1}/${r.steps.length}</span><button class="btn icon ghost" data-a="closeModal" aria-label="Close">${I.x}</button></div>
 <div style="text-align:center;display:grid;gap:8px;padding:10px 0"><h2>${st[0]}</h2><p class="muted">${st[2]}</p><div class="num" style="font-family:var(--f-display);font-size:4rem;line-height:1">${fmtSec(left)}</div><div class="lvl"><i style="width:${(1-left/st[1])*100}%"></i></div><p class="tiny muted">${nx?"Next: "+nx[0]:"Last one, beautiful"}</p></div>
 <div class="row" style="justify-content:center"><button class="btn" data-rt="pause">${paused?I.play+" Resume":I.pause+" Pause"}</button><button class="btn ghost" data-rt="skip">Skip</button></div>`)};
 const finish=()=>{clearInterval(MT);const min=Math.max(1,Math.round(elapsed/60));S.moves.push({id:uid(),date:dk(),ts:Date.now(),type:r.type,min,feel:"Gentle",note:r.n});save();evalQuests();openModal(`<div style="text-align:center;display:grid;gap:10px;justify-items:center">${mascot("bounce")}<h2>Beautifully done</h2><p class="muted">${min} minutes of ${r.n.toLowerCase()} saved to your movement log.</p><button class="btn" data-a="closeModal">Close</button></div>`);celebrate(true);render()};
 draw();$("#modal").onclick=e=>{const b=e.target.closest("[data-rt]");if(!b)return;if(b.dataset.rt==="pause"){paused=!paused;draw()}else{s++;if(s>=r.steps.length)return finish();left=r.steps[s][1];draw()}};
 clearInterval(MT);MT=setInterval(()=>{if(paused)return;left--;elapsed++;if(left<=0){chime();s++;if(s>=r.steps.length)return finish();left=r.steps[s][1]}draw()},1000)}
function runVisual(i){const v=VISUALS[i];let n=0;const draw=()=>openModal(`<div class="row" style="justify-content:space-between"><span class="eyebrow">${v.n}</span><button class="btn icon ghost" data-a="closeModal" aria-label="Close">${I.x}</button></div><div class="orb" id="orb"></div><p class="intent" style="text-align:center;min-height:3.2em">${v.lines[n]}</p><div class="lvl"><i style="width:${(n+1)/v.lines.length*100}%"></i></div><div class="row" style="justify-content:center"><button class="btn ghost sm" data-a="vNext">Next</button><button class="btn ghost sm" data-a="vVoice">Read aloud</button></div>`);
 draw();breatheOrb();window.__vis={next(){n++;if(n>=v.lines.length){closeModal();day().listen+=Math.round(v.lines.length*12/60);save();evalQuests();toast("<b>Visualization complete ✦</b>");render();return}draw();breatheOrb();if(window.__vis.voice)speak(v.lines[n])},voice:false};
 clearInterval(MT);MT=setInterval(()=>window.__vis.next(),12000)}
function breatheOrb(){const o=$("#orb");if(!o||reduced)return;let big=false;const f=()=>{const el=$("#orb");if(!el)return;big=!big;el.style.transform=big?"scale(1.15)":"scale(.85)"};f();clearInterval(window.__orb);window.__orb=setInterval(f,4000)}
function runBreath(){let t=0;const total=180;const phases=[["Breathe in",4,1.2],["Hold",4,1.2],["Breathe out",6,.8]];let pi=0,pl=4;
 const draw=()=>openModal(`<div class="row" style="justify-content:space-between"><span class="eyebrow">Breathing orb · 4-4-6</span><button class="btn icon ghost" data-a="closeModal" aria-label="Close">${I.x}</button></div><div class="orb" id="orb" style="transform:scale(${phases[pi][2]});transition:transform ${phases[pi][1]}s ease-in-out"></div><h2 style="text-align:center">${phases[pi][0]}</h2><p class="tiny muted num" style="text-align:center">${fmtSec(total-t)} left</p>`);
 draw();clearInterval(MT);MT=setInterval(()=>{t++;pl--;if(pl<=0){pi=(pi+1)%3;pl=phases[pi][1];draw()}else{const el=$(".tiny.muted.num",$("#modal"));if(el)el.textContent=fmtSec(total-t)+" left"}if(t>=total){closeModal();day().listen+=3;save();evalQuests();render();toast("<b>Three calm minutes ✦</b>")}},1000)}
function confirmBox(msg,yes,cb){openModal(`<h3>${msg}</h3><div class="row"><button class="btn" id="cfYes">${yes}</button><button class="btn ghost" data-a="closeModal">Cancel</button></div>`);$("#cfYes").onclick=()=>{closeModal();cb()}}

/* ---------- photos (IndexedDB, device only) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("moonbloom-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function photoAll(){const db=await idb();return new Promise(r=>{const q=db.transaction("p").objectStore("p").getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}
async function photoPut(o){const db=await idb();return new Promise(r=>{const t=db.transaction("p","readwrite");t.objectStore("p").put(o);t.oncomplete=r})}
async function photoDel(id){const db=await idb();return new Promise(r=>{const t=db.transaction("p","readwrite");t.objectStore("p").delete(id);t.oncomplete=r})}
async function loadPhotos(){const g=$("#photoGrid");if(!g)return;try{const L=(await photoAll()).sort((a,b)=>b.date.localeCompare(a.date));g.innerHTML=L.length?L.map(p=>`<div class="photo" data-a="revealPhoto"><img src="${p.data}" alt="Progress photo from ${fmtDate(p.date)}"><div class="cap"><span>${fmtDate(p.date,{month:"short",day:"numeric",year:"2-digit"})}</span><button class="link" style="color:#fff" data-a="delPhoto" data-id="${p.id}">Delete</button></div></div>`).join(""):'<p class="small muted">No photos. That is completely fine.</p>'}catch(e){g.innerHTML='<p class="small muted">Photo storage isn\'t available in this browser.</p>'}}
$("#photoInput").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const img=new Image();img.onload=async()=>{const s=Math.min(1,1080/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=img.width*s;cv.height=img.height*s;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);await photoPut({id:uid(),date:dk(),data:cv.toDataURL("image/jpeg",.82)});URL.revokeObjectURL(img.src);loadPhotos()};img.src=URL.createObjectURL(f)});

async function offerFile(name,data){if(!window.claude){try{const b=new Blob([data],{type:name.endsWith(".csv")?"text/csv":"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("<b>Downloaded ✦</b>");return}catch(e){}}try{const c=window.claude;const dl=c&&c.use?await c.use("downloads"):null;if(dl){await dl.save({filename:name,data});toast("<b>Saved ✦</b>");return}}catch(e){if(e&&e.code==="declined")return}
 openModal(`<div class="row" style="justify-content:space-between"><h3>${esc(name)}</h3><button class="btn icon ghost" data-a="closeModal" aria-label="Close">${I.x}</button></div><p class="small muted">Copy this and keep it somewhere safe.</p><textarea id="expTxt" style="min-height:240px;font-family:ui-monospace,monospace;font-size:.75rem">${esc(data)}</textarea><button class="btn" id="cpy">Copy</button>`);
 $("#cpy").onclick=async()=>{try{await navigator.clipboard.writeText(data);toast("<b>Copied</b>")}catch(e){$("#expTxt").select()}}}
$("#importInput").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1||!o.days)throw 0;confirmBox("Replace everything with this backup?","Restore",()=>{S=merge(DEF(),o);migrate();save();applyAccent();render();toast("<b>Backup restored ✦</b>")})}catch(x){toast("<b>That file isn't a Moonbloom backup.</b><span class='small muted'>Choose a .json file exported from Settings.</span>")}};r.readAsText(f)});

/* ---------- celebration ---------- */
const fx=$("#fx"),fctx=fx.getContext("2d");let parts=[],raf=0;
function celebrate(big){document.querySelectorAll(".mascot").forEach(m=>{m.classList.remove("bounce");void m.getBoundingClientRect();m.classList.add("bounce")});if(reduced)return;fx.width=innerWidth;fx.height=innerHeight;const cols=["#F4BBDD","#BBA3E8","#DCCBFA","#F6D77A","#DDEBFF"];const n=big?70:24;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*5+3,c:cols[i%5],r:Math.random()*6,l:70+Math.random()*40});if(!raf)loop()}
function loop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l-->0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.r+=.1;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.globalAlpha=Math.min(1,p.l/30);fctx.fillStyle=p.c;fctx.beginPath();for(let k=0;k<8;k++){const rad=k%2?p.s*.4:p.s;const a=k*Math.PI/4;fctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}fctx.fill();fctx.restore()}raf=parts.length?requestAnimationFrame(loop):0;if(!raf)fctx.clearRect(0,0,fx.width,fx.height)}

 for(let d=1;d<=n;d++){const k=dk(new Date(y,mo,d)),wd=new Date(y,mo,d).getDay();const tr=S.beauty.filter(t=>k>=today&&dueOn(t,k)||t.last===k);const wk=["am","pm","hair","self"].flatMap(c=>S.care[c].filter(x=>x.days.length&&x.days.includes(wd)));
  cells+=`<div class="bcell ${k===today?"today":""}"><span class="tiny num" style="font-weight:800">${d}</span><div class="bdots">${tr.map(t=>`<i title="${esc(t.n)}" class="${t.last===k?"done":""}"></i>`).join("")}${wk.map(x=>`<i class="wk" title="${esc(x.text)}"></i>`).join("")}</div></div>`}
 const L=S.beauty.slice().sort((a,b)=>nextDue(a).localeCompare(nextDue(b)));
 return `<div class="view"><header class="stack" style="gap:4px"><div class="eyebrow">Self-care</div><h1>Rituals for skin, hair &amp; heart</h1></header>${careTabs()}
 <div class="split"><section class="card pearl"><div class="card-h"><button class="btn icon ghost" data-a="bMonth" data-d="-1" aria-label="Previous month">‹</button><h3>${BMONTH.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</h3><button class="btn icon ghost" data-a="bMonth" data-d="1" aria-label="Next month">›</button></div>
 <div class="moodgrid">${["S","M","T","W","T","F","S"].map(x=>`<div style="border:0" class="tiny muted">${x}</div>`).join("")}${cells}</div><div class="row tiny" style="margin-top:10px;gap:12px"><span class="row" style="gap:4px"><span class="pebble" style="background:var(--accent);width:8px;height:8px"></span>treatment due</span><span class="row" style="gap:4px"><span class="pebble" style="background:var(--lilac);width:8px;height:8px"></span>weekly routine step</span><span class="row" style="gap:4px"><span class="pebble" style="background:var(--water);width:8px;height:8px"></span>done</span></div></section>
 <section class="card pearl"><div class="card-h"><h3>Treatments</h3><span class="tiny muted">repeat every N days</span></div><div class="stack">${L.map(t=>{const nd=nextDue(t);const due=nd===today;return `<div class="wl"><span class="pill ${due?"":"lav"}">${due?"today":fmtDate(nd)}</span><span class="small" style="min-width:0"><b>${esc(t.n)}</b><br><span class="tiny muted">${esc(t.area)} · every <input type="number" min="1" max="90" value="${t.every}" data-ch="bEvery" data-id="${t.id}" style="width:56px;padding:2px 6px;display:inline-block"> days${t.last?` · last ${fmtDate(t.last)}`:""}</span></span><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm ${t.last===today?"soft":""}" data-a="bDone" data-id="${t.id}">${t.last===today?"Done ✓":"Done today"}</button><button class="btn icon ghost" data-a="bDel" data-id="${t.id}" aria-label="Remove">${I.x}</button></span></div>`}).join("")}</div>
 <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="bNew" placeholder="Add a treatment, e.g. Gua sha"><input type="number" id="bEv" value="7" min="1" style="width:70px" aria-label="Every N days"><button class="btn sm" data-a="bAdd">Add</button></div></section></div></div>`}

/* ---------- body focus goals ---------- */
const FOCUS=["Improve muscular definition","Build strength","Improve cardiovascular endurance","Develop stronger glutes and legs","Improve core stability","Improve posture and mobility","Feel more comfortable and confident in my body","Establish consistent healthy habits"];
function focusGoals(){const f=S.profile.focus||[];return `<section class="card pearl"><div class="card-h"><h3>What I'm blooming toward</h3><span class="tiny muted">choose any</span></div><div class="row" style="gap:6px">${FOCUS.map(g=>`<button class="chip" aria-pressed="${f.includes(g)}" data-a="focusT" data-v="${esc(g)}">${g}</button>`).join("")}</div><p class="tiny muted" style="margin-top:10px">Moonbloom tracks these through strength records, consistency, energy and comfort. It never sets a target weight or a deadline.</p></section>`}

/* ---------- widgets ---------- */
Object.assign(W,{
 train(){const wd=new Date().getDay(),ss=sessionsOn(wd).filter(s=>tplOf(s).type!=="rest");const done=sid=>S.training.logs.some(l=>l.date===dk()&&l.sid===sid);
  return card("Training",ss.length&&!day().rest?`<div class="stack">${ss.map(s=>`<div class="wl" style="grid-template-columns:minmax(0,1fr) auto"><span class="small"><b>${tplOf(s).t}</b><br><span class="tiny muted">${s.slot==="AM"?"Morning":"Afternoon"} · ${s.min} min${s.opt?" · optional":""}</span></span>${done(s.id)?'<span class="pill sky">logged ✓</span>':`<button class="btn sm" data-a="startSess" data-sid="${s.id}">${I.play} Start</button>`}</div>`).join("")}</div>`:`<p class="small muted">Rest and reset today. Recovery is training too.</p>`,`<button class="link small" data-a="go" data-v="train">Week</button>`)},
 meals(){const P=slotOf(dk());const any=Object.values(P).some(a=>a.length);return card("Today's meals",any?`<div class="stack" style="gap:6px">${Object.entries(MEALS).map(([m,l])=>P[m].length?`<p class="small"><span class="eyebrow" style="font-size:.64rem">${l}</span><br>${P[m].map(x=>esc(itemName(x))).join(", ")}</p>`:"").join("")}</div>`:`<p class="small muted">Nothing planned yet. A plan makes the easy choice the one you want.</p><button class="btn sm" style="margin-top:10px" data-a="go" data-v="nourish">Plan my meals</button>`,`<button class="link small" data-a="go" data-v="nourish">Plan</button>`)}
});
Object.assign(WNAMES,{train:"Today's training",meals:"Today's meals"});

/* ---------- actions ---------- */
Object.assign(A,{
 startSess:e=>openSession(e.dataset.sid,!!e.dataset.short),
 goCare:e=>{SUB.care=e.dataset.v;go("care")},
 planDone:e=>{setPlan(e.dataset.id,"done");celebrate(false);render()},
 planSkip:e=>{setPlan(e.dataset.id,"skip");render()},
 planShort:e=>{setPlan(e.dataset.id,"short");render()},
 planSnooze:e=>{setPlan(e.dataset.id,"later@"+toTime(Math.ceil((nowMin()+15)/5)*5));toast("<b>Snoozed for 15 minutes</b>",2200);render()},
 planReOpen:()=>{const b=$("#reBox");if(b)b.hidden=!b.hidden},
 planRe:e=>{const t=val("reTime");if(!t)return;setPlan(e.dataset.id,"later@"+t);toast(`<b>Moved to ${ampm(t)}</b>`,2200);render()},
 planLater:e=>{setPlan(e.dataset.id,"later@"+toTime(Math.ceil((nowMin()+30)/5)*5));render()},
 recSet:e=>{const d=day();d.recovery=d.recovery||{};const k=e.dataset.k,v=+e.dataset.v;d.recovery[k]=d.recovery[k]===v?undefined:v;save();render()},
 restT:e=>{const d=day();d.restList=d.restList||{};const id=e.dataset.id;d.restList[id]?delete d.restList[id]:d.restList[id]=1;save();evalQuests();render()},
 drChk:e=>{const D=draft();const k=e.dataset.k,i=e.dataset.i;D[k][i]=!D[k][i];save();render()},
 drMode:e=>{draft().mode=e.dataset.v;save();render()},
 finishSess:()=>{const s=S.training.week.find(x=>x.id===ACT.sid),T=tplOf(s),D=draft();const sets={};for(const id in D.sets){const arr=(D.sets[id]||[]).filter(x=>x&&(x.r||x.w));if(arr.length)sets[id]=arr}
  const min=T.type==="res"?(ACT.short?25:s.min):(+D.min||(ACT.short?25:s.min));
  if(T.type==="res"&&!Object.keys(sets).length&&!Object.values(D.warm).some(Boolean)){toast("<b>Log at least one set first.</b><span class='small muted'>Or use \"Not today\" on the home plan. No pressure.</span>",4200);return}
  S.training.logs.push({id:uid(),date:dk(),sid:s.id,title:T.t,type:T.type,min,u:uW(),sets,notes:D.notes,pain:D.pain,mode:D.mode,rpe:D.rpe,feel:D.feel,short:ACT.short});
  S.moves.push({id:uid(),date:dk(),ts:Date.now(),type:T.type==="res"?"Strength":(D.mode||(T.type==="cardio"?"Cardio":"Mobility")),min,feel:D.rpe?("Effort "+D.rpe.split(" ")[0]):"Steady",note:T.t});
  const it=planItems().find(i=>i.sid===s.id&&i.kind==="work");if(it)setPlan(it.id,"done");
  S.game.xp+=20;S.game.crystals+=1;S.training.draft=null;save();evalQuests();
  const painNote=Object.values(D.pain).some(Boolean)?" You noted pain on an exercise, so next time Moonbloom suggests an alternative. If it was sharp or lingers, check with a physio.":"";
  ACT=null;SUB.train="today";render();openModal(`<div style="text-align:center;display:grid;gap:10px;justify-items:center">${mascot("bounce")}<h2>Session saved ✦</h2><p class="muted">${T.t} · ${min} min. +20 xp and a crystal.${painNote}</p><p class="small">Refuel with protein and carbs in the next couple of hours, drink water, and sleep well. That's where the progress happens.</p><button class="btn" data-a="closeModal">Close</button></div>`);celebrate(true)},
 sessEdit:e=>sessModal(e.dataset.sid),
 sessAdd:e=>sessModal(null,+e.dataset.wd),
 sessSave:e=>{const sid=e.dataset.sid;const s=sid?S.training.week.find(x=>x.id===sid):{id:uid()};s.wd=+val("seDay");s.slot=val("seSlot");s.tpl=val("seTpl");s.min=+val("seMin")||0;s.time=val("seTime");s.opt=$("#seOpt").checked;if(!sid)S.training.week.push(s);save();closeModal();render()},
 sessDup:e=>{const s=S.training.week.find(x=>x.id===e.dataset.sid);S.training.week.push({...s,id:uid()});save();closeModal();toast("<b>Session duplicated</b><span class='small muted'>Tap the copy to move it to another day.</span>");render()},
 sessDel:e=>{S.training.week=S.training.week.filter(x=>x.id!==e.dataset.sid);save();closeModal();render()},
 weekReset:()=>confirmBox("Restore your starting weekly template? Your logged workouts stay.","Restore",()=>{S.training.week=DEF2().training.week;save();render()}),
 profSet:e=>{S.training.prof[e.dataset.k]=e.dataset.v;save();render()},
 profSave:()=>{if(!S.training.prof.lvl){toast("<b>Choose your training experience first.</b>");return}S.training.prof.set=true;save();toast("<b>Profile saved ✦</b><span class='small muted'>Sets, reps and starting loads now match your level.</span>");SUB.train="today";render()},
 planWk:e=>{PLANWK+= +e.dataset.d;render()},
 mealAdd:e=>mealPicker(e.dataset.k,e.dataset.m),
 mealPick:e=>{slotOf(e.dataset.k)[e.dataset.m].push({r:e.dataset.r});save();closeModal();render()},
 mealTxtAdd:e=>{const t=val("mealTxt").trim();if(!t)return;slotOf(e.dataset.k)[e.dataset.m].push({t});save();closeModal();render()},
 mealDel:e=>{slotOf(e.dataset.k)[e.dataset.m].splice(+e.dataset.i,1);save();render()},
 planFill:()=>{const ds=weekDates(PLANWK);let n=0;ds.forEach((k,di)=>{const P=slotOf(k);for(const m of ["b","l","d","s"]){if(P[m].length)continue;const L=recipesAll().filter(r=>r.m.includes(m)&&rOk(r));if(!L.length)continue;P[m].push({r:L[(hash(k+m)+di)%L.length].id});n++}});save();toast(n?`<b>${n} ideas added</b><span class='small muted'>Swap anything that doesn't sound good.</span>`:"<b>Every slot already has a plan.</b>");render()},
 rFilt:e=>{RFILT=e.dataset.v;render()},
 rToPlan:e=>{const r=rById(e.dataset.r);const ds=weekDates(0).filter(k=>k>=dk());openModal(`<div class="row" style="justify-content:space-between"><h3>Add ${esc(r.n)}</h3><button class="btn icon ghost" data-a="closeModal" aria-label="Close">${I.x}</button></div><div class="fields"><label class="f">Day<select id="rpD">${ds.concat(weekDates(1)).map(k=>`<option value="${k}">${fmtDate(k,{weekday:"short",month:"short",day:"numeric"})}</option>`).join("")}</select></label><label class="f">Meal<select id="rpM">${r.m.map(m=>`<option value="${m}">${MEALS[m]}</option>`).join("")}</select></label></div><button class="btn" data-a="rToPlanOk" data-r="${r.id}">Add to plan</button>`)},
 rToPlanOk:e=>{slotOf(val("rpD"))[val("rpM")].push({r:e.dataset.r});save();closeModal();toast("<b>Added to your meal plan</b>",2200);render()},
 rAdd:()=>{const n=val("nrN").trim();if(!n){toast("<b>Give your recipe a name.</b>");return}const m=Object.keys(MEALS).filter(k=>$("#nrM_"+k).checked);const ingL=val("nrI").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const mt=l.match(/^([\d.,½]+)\s*(g|kg|ml|l|tbsp|tsp|cup|cups|pc|can)?\s+(.+)$/i);return mt?ing(mt[3],+mt[1].replace(",",".").replace("½",".5")||1,(mt[2]||"pc").toLowerCase(),"My recipes"):ing(l,1,"","My recipes")});
  S.food.recipes.push({id:"u"+uid(),own:true,n,m:m.length?m:["l"],min:+val("nrMin")||20,p:+val("nrP")||0,tags:[],al:[],ing:ingL,st:val("nrS").split("\n").map(s=>s.trim()).filter(Boolean)});save();toast("<b>Recipe saved ♡</b>");render()},
 rDel:e=>{S.food.recipes=S.food.recipes.filter(r=>r.id!==e.dataset.r);save();render()},
 groT:e=>{const wk=weekDates(PLANWK)[0];const ck=S.food.gro[wk]||(S.food.gro[wk]={});const n=e.dataset.n;ck[n]=!ck[n];save();render()},
 groX:e=>{const x=S.food.extra.find(i=>i.id===e.dataset.id);x.done=!x.done;save();render()},
 groXDel:e=>{S.food.extra=S.food.extra.filter(i=>i.id!==e.dataset.id);save();render()},
 groAdd:()=>{const t=val("groNew").trim();if(!t)return;S.food.extra.push({id:uid(),t,done:false});save();render()},
 chalT:e=>{const C=S.food.chal,k=dk();C.log[k]=C.log[k]||{};const h=e.dataset.h;C.log[k][h]=!C.log[k][h];save();if(C.log[k][h])celebrate(false);render()},
 chalDel:e=>{S.food.chal.habits=S.food.chal.habits.filter(h=>h.id!==e.dataset.id);save();render()},
 chalAdd:()=>{const t=val("chalNew").trim();if(!t)return;S.food.chal.habits.push({id:uid(),t,on:true});save();render()},
 mjAdd:()=>{const w=val("mjW").trim();if(!w){toast("<b>Add what you ate.</b>");return}S.food.journal.push({id:uid(),date:dk(),time:val("mjT")||toTime(nowMin()),m:val("mjM"),h:+val("mjH"),f:+val("mjF"),w,n:val("mjN").trim()});save();render()},
 mjDel:e=>{S.food.journal=S.food.journal.filter(x=>x.id!==e.dataset.id);save();render()},
 fpAl:e=>{const a=S.food.prefs.allergies,v=e.dataset.v;S.food.prefs.allergies=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render()},
 enClear:()=>{S.food.energy={sex:"female",age:"",h:"",w:"",act:"2"};save();render()},
 bMonth:e=>{BMONTH=new Date(BMONTH.getFullYear(),BMONTH.getMonth()+ +e.dataset.d,1);render()},
 bDone:e=>{const t=S.beauty.find(x=>x.id===e.dataset.id);t.last=t.last===dk()?"":dk();save();if(t.last)celebrate(false);render()},
 bDel:e=>{S.beauty=S.beauty.filter(x=>x.id!==e.dataset.id);save();render()},
 bAdd:()=>{const n=val("bNew").trim();if(!n)return;S.beauty.push({id:uid(),n,every:+val("bEv")||7,area:"Custom",last:""});save();render()},
 focusT:e=>{const f=S.profile.focus||(S.profile.focus=[]);const v=e.dataset.v;S.profile.focus=f.includes(v)?f.filter(x=>x!==v):[...f,v];save();render()},
 notifOn:async()=>{if(!("Notification" in window)){toast("<b>This browser doesn't support notifications.</b><span class='small muted'>On iPhone, install Moonbloom to your Home Screen first.</span>",6000);return}const p=await Notification.requestPermission();if(p==="granted"){S.profile.notify=true;save();notify("Moonbloom","Notifications are on. Luna will nudge you gently ♡");toast("<b>Notifications on ✦</b>")}else toast("<b>Notifications are blocked.</b><span class='small muted'>Allow them in your browser or phone settings for this site, then try again.</span>",6000);render()},
 notifOff:()=>{S.profile.notify=false;save();render()},
 notifTest:()=>notify("Hydration check-in","A 250 ml sip, whenever you're ready ♡"),
 remDay:e=>{const r=S.reminders.find(x=>x.id===e.dataset.id);const d=+e.dataset.d;r.days=(r.days||[]).includes(d)?r.days.filter(x=>x!==d):[...(r.days||[]),d].sort();save();render()}
});
Object.assign(CH,{
 rtWake:e=>{S.water.wake=e.value;save()},rtBed:e=>{S.water.bed=e.value;save()},
 rt:e=>{S.routine[e.dataset.k]=e.value;save()},rtNudge:e=>{S.routine.nudges=e.checked;save()},
 profNotes:e=>{S.training.prof.notes=e.value;save()},
 chalRefl:e=>{S.food.chal.refl[e.dataset.w]=e.value;save()},
 chalName:e=>{S.food.chal.name=e.value||"My challenge";save()},chalStart:e=>{if(e.value){S.food.chal.start=e.value;save();render()}},chalEnd:e=>{if(e.value){S.food.chal.end=e.value;save();render()}},
 chalOn:e=>{S.food.chal.habits.find(h=>h.id===e.dataset.id).on=e.checked;save();render()},
 chalTxt:e=>{S.food.chal.habits.find(h=>h.id===e.dataset.id).t=e.value;save()},
 fpDiet:e=>{S.food.prefs.diet=e.value;save();render()},fpLike:e=>{S.food.prefs.likes=e.value;save()},fpDis:e=>{S.food.prefs.dislikes=e.value;save()},
 enSex:e=>{S.food.energy.sex=e.value;save();render()},en:e=>{S.food.energy[e.dataset.k]=e.value;save();render()},
 bEvery:e=>{S.beauty.find(x=>x.id===e.dataset.id).every=clamp(+e.value||7,1,90);save();render()}
});
document.addEventListener("input",e=>{const el=e.target;if(!ACT)return;const D=draft();
 if(el.dataset.tr){const id=el.dataset.ex,i=+el.dataset.i;const a=D.sets[id]||(D.sets[id]=[]);a[i]=a[i]||{};a[i][el.dataset.tr]=el.value;save()}
 else if(el.dataset.trn){D.notes[el.dataset.trn]=el.value;save()}
 else if(el.dataset.dr){D[el.dataset.dr]=el.value;save()}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.trp&&ACT){draft().pain[el.dataset.trp]=el.checked;save()}else if(el.dataset.tr&&ACT){const D=draft(),id=el.dataset.ex,i=+el.dataset.i;const a=D.sets[id]||(D.sets[id]=[]);a[i]=a[i]||{};a[i][el.dataset.tr]=el.value;save()}else if(el.dataset.dr&&ACT){draft()[el.dataset.dr]=el.value;save()}});
setInterval(tickPlan,30000);setTimeout(tickPlan,3000);

/* ---------- boot ---------- */
(function stars(){const s=$("#stars");let h="";for(let i=0;i<26;i++){const x=(hash("x"+i)%1000)/10,y=(hash("y"+i)%1000)/10;h+=`<span class="star" style="left:${x}%;top:${y}%;animation-delay:${(i%7)*.6}s;${i%5===0?"width:4px;height:4px;background:var(--candy)":""}"></span>`}s.innerHTML=h})();
migrate();applyAccent();day();evalQuests();render();
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(VIEW==="settings")render()};
let lastDay=dk();setInterval(()=>{tickReminders();if(dk()!==lastDay){lastDay=dk();render()}},30000);setTimeout(tickReminders,2500);
connect();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tickReminders();tickPlan();render()}});
})();
